name: Auto-merge Registry

# Merges a registry PR, from anyone and for any app, once the marketplace
# check passes, when the change is one the check validated: see
# validation/auto_merge.py. Every other PR still waits for a person, and
# is labelled held-for-review when its passing check could not merge it.
#
# workflow_run always runs this file and the script from main, so a PR
# cannot change the rules it is judged by, and nothing from the PR runs.

on:
  workflow_run:
    workflows: ["Marketplace App Check"]
    types: [completed]

permissions:
  contents: write
  issues: write # to create the held-for-review label
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}

    steps:
      # The check passed for this exact commit. If a newer one was pushed
      # since, the PR's head has moved and its own run decides instead.
      - name: Find the pull request at the commit that passed
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        # By head commit, not branch name: fork branches can share a name.
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 500 \
            --json number,headRefOid,isDraft \
            --jq '.[] | select(.headRefOid == env.HEAD_SHA and (.isDraft | not)) | .number' | head -n 1)
          if [ -z "$number" ]; then
            echo "No open, ready PR is at $HEAD_SHA any more — nothing to merge."
            exit 0
          fi
          gh pr diff "$number" --repo "$GITHUB_REPOSITORY" --name-only > "$RUNNER_TEMP/changed-files"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The rules come from main, and the PR is judged by what merging it
      # would make of main now, so releases or apps merged while its check
      # ran neither read as removed nor let it move a branch backwards.
      - name: Check out main
        if: steps.pr.outputs.number
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0

      - name: Merge the PR into main locally
        id: merged
        if: steps.pr.outputs.number
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git -C main fetch -q origin "refs/pull/$NUMBER/head"
          test "$(git -C main rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git -C main worktree add -q --detach "$PWD/base" HEAD
          git -C main worktree add -q --detach "$PWD/head" HEAD
          if ! git -C head -c user.name=auto-merge -c user.email=auto-merge@localhost merge -q --no-edit "$HEAD_SHA"; then
            echo "Held for review: it conflicts with main."
            exit 0
          fi
          git -C head diff --name-only "$(git -C base rev-parse HEAD)" HEAD >> "$RUNNER_TEMP/changed-files"
          sort -u -o "$RUNNER_TEMP/changed-files" "$RUNNER_TEMP/changed-files"
          echo "clean=true" >> "$GITHUB_OUTPUT"

      - name: Check the change is one the check validated
        id: eligible
        if: steps.merged.outputs.clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for the commit-order lookups
        run: python3 main/validation/auto_merge.py base head --changed-files "$RUNNER_TEMP/changed-files"

      # --match-head-commit makes GitHub refuse the merge if the PR moved on
      # after the check above. A label left by an earlier held run goes first.
      - name: Merge
        id: merge
        if: steps.eligible.outputs.mergeable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx held-for-review; then
            gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label held-for-review
          fi
          gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"

      # Held by the rules, a conflict with main, a failed merge or a crash
      # above: the reason is in this run's log.
      - name: Label the PR held for review
        if: ${{ !cancelled() && steps.pr.outputs.number && steps.merge.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh label create held-for-review --repo "$GITHUB_REPOSITORY" --force --color D93F0B \
            --description "Passed the marketplace check but needs a reviewer to merge"
          gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label held-for-review
