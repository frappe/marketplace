name: Marketplace App Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # to post the findings report as a PR comment

# One run per PR. Without this, a slow run for an older commit can finish
# after a newer one and overwrite its comment, leaving the PR showing
# findings for code that is no longer there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semgrep-check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs on every PR (no `paths:` filter) so it can be a required status
      # check on main - a required check that only triggers on some paths
      # never reports on other PRs and blocks them forever. This step keeps
      # the job itself fast/green for PRs that don't touch apps.json instead.
      - name: Check whether apps.json changed
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx "apps.json"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure PR is up to date with ${{ github.event.pull_request.base.ref }}
        if: steps.diff.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "::error::This PR is behind ${{ github.event.pull_request.base.ref }}. Merge or rebase the latest ${{ github.event.pull_request.base.ref }} into your branch, then push again — dependency checks run against the base branch and need it up to date."
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.diff.outputs.changed == 'true'
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install semgrep
        if: steps.diff.outputs.changed == 'true'
        run: uv tool install semgrep

      - name: Install pilot
        if: steps.diff.outputs.changed == 'true'
        # Pinned to a release tag, not @main — a floating ref here means a
        # pilot change and a bug in this script could land at the same time,
        # making failures here much harder to diagnose. Bump deliberately.
        run: pip install git+https://github.com/frappe/pilot@v0.0.9-pre-alpha

      - name: Get base apps.json
        if: steps.diff.outputs.changed == 'true'
        run: git show ${{ github.event.pull_request.base.sha }}:apps.json > /tmp/apps_before.json

      - name: Check changed marketplace apps
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 validation/check.py /tmp/apps_before.json apps.json \
            --report /tmp/report.md --commit "${{ github.event.pull_request.head.sha }}"

      # !cancelled() rather than always(): the report matters most when the
      # checks failed, but a run cancelled by a newer push must stay quiet —
      # always() is true for cancelled runs too, so it would let a superseded
      # run post its now-stale findings over the newer run's comment.
      - name: Report findings on the PR
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f /tmp/report.md ] || { echo "No report written — the check crashed before scanning."; exit 0; }
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          # Fork PRs get a read-only token, so commenting fails there by
          # design — the job summary above is the fallback, and the job's own
          # pass/fail is unaffected either way.
          gh pr comment "$PR" --body-file /tmp/report.md --edit-last --create-if-none \
            || echo "Could not comment on the PR (expected for forks); see the job summary."
