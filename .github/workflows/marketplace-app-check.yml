name: Marketplace App Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # to post the findings report as a PR comment

# One run per PR, so a slow older run cannot finish last and overwrite a
# newer run's comment with stale findings.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semgrep-check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs on every PR (no `paths:` filter) so it can be a required status
      # check on main - a required check that only triggers on some paths
      # never reports on other PRs and blocks them forever. This step keeps
      # the job itself fast/green for PRs that don't touch the registry.
      - name: Check whether the registry changed
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(apps\.json|apps/[^/]+\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure PR is up to date with ${{ github.event.pull_request.base.ref }}
        if: steps.diff.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "::error::This PR is behind ${{ github.event.pull_request.base.ref }}. Merge or rebase the latest ${{ github.event.pull_request.base.ref }} into your branch, then push again — dependency checks run against the base branch and need it up to date."
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.diff.outputs.changed == 'true'
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install semgrep
        if: steps.diff.outputs.changed == 'true'
        run: uv tool install semgrep

      # Tracks pilot's develop branch, so the get-app here is always the one
      # benches actually run. The trade is that a pilot change can turn this
      # job red without anything in this repo changing — check pilot's recent
      # commits before assuming the app is at fault.
      - name: Check out pilot
        if: steps.diff.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: frappe/pilot
          ref: develop
          path: .pilot

      # What `pilot init` checks the host for: Node 24 and yarn for Frappe's
      # assets, Redis, and the headers Frappe's Python dependencies build
      # against. Benches use SQLite, so no database server is needed.
      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: "24"

      - name: Install bench system packages
        if: steps.diff.outputs.changed == 'true'
        run: |
          # Runners preconfigure Microsoft apt repos that intermittently 403;
          # they aren't needed here and otherwise fail the whole apt-get update.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list
          sudo apt-get update -y
          sudo apt-get install -y redis-server build-essential pkg-config python3-dev libmariadb-dev
          npm install -g yarn
          # Pilot caps asset builds with a `systemd-run --user` scope. Swap
          # would let a build past the cap, so the runner gets none.
          sudo loginctl enable-linger "$USER"
          sudo swapoff -a

      - name: Install pilot
        if: steps.diff.outputs.changed == 'true'
        # Editable, so pilot keeps its registry cache inside .pilot as on a
        # host install. packaging is this repo's own: pilot vendors its copy.
        run: pip install packaging -e ./.pilot

      # Pilot builds uncapped, with only a warning, where it cannot cap. The
      # memory check would then pass every app, so stop here instead.
      - name: Ensure asset builds can be memory-capped
        if: steps.diff.outputs.changed == 'true'
        run: python3 -c "from pilot.managers.systemd_user import can_cap_memory; assert can_cap_memory(), 'systemd-run --user cannot cap memory on this runner'"

      # A worktree, not `git show`: the base side is now a directory
      # (apps.json plus apps/<name>.json), so the whole tree is needed.
      - name: Materialise the base registry
        if: steps.diff.outputs.changed == 'true'
        run: git worktree add --detach /tmp/base-registry ${{ github.event.pull_request.base.sha }}

      - name: Check changed marketplace releases
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One bench per Frappe branch, set up on first use (validation/utils/bench.py).
          VALIDATION_BENCHES_DIR: ${{ runner.temp }}/benches
        run: |
          python3 validation/check.py /tmp/base-registry . \
            --report /tmp/report.md --commit "${{ github.event.pull_request.head.sha }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # !cancelled(), not always(): failures must report, but a superseded
      # run must stay quiet — always() is true for cancelled runs too.
      - name: Report findings on the PR
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/post_report.sh /tmp/report.md

