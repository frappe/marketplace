name: Rereview Command

on:
  issue_comment:
    types: [created]

# No app code runs here — it only re-runs the pull_request check, which keeps
# its own fork-appropriate token.
permissions:
  actions: write
  pull-requests: write

jobs:
  rereview:
    # Exact, so a '/rereviewed' comment never provisions a runner.
    if: github.event.issue.pull_request && github.event.comment.body == '/rereview'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - run: .github/scripts/rereview_command.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENTER: ${{ github.event.comment.user.login }}
          # Via env, never interpolated into the shell: comment bodies are
          # attacker-controlled. The script requires an exact match.
          BODY: ${{ github.event.comment.body }}
