name: Auto-merge Release

# Merges a publish PR once the marketplace check passes, but only a
# release-only change by an app of a trusted organisation (frappe for now:
# validation/auto_merge.py). Every other PR still waits for a person.
#
# workflow_run always runs this file and the script from main, so a PR
# cannot change the rules it is judged by, and nothing from the PR runs.

on:
  workflow_run:
    workflows: ["Marketplace App Check"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # Publish branches live in this repo; a fork's PR always needs a reviewer.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'publish/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.head_branch }}

    steps:
      # The check passed for this exact commit. If a newer one was pushed
      # since, the PR's head has moved and its own run decides instead.
      - name: Find the pull request at the commit that passed
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --base main --state open \
            --json number,headRefOid --jq '.[] | select(.headRefOid == env.HEAD_SHA) | .number')
          if [ -z "$number" ]; then
            echo "No open PR on $HEAD_BRANCH is at $HEAD_SHA any more — nothing to merge."
            exit 0
          fi
          gh pr diff "$number" --repo "$GITHUB_REPOSITORY" --name-only > "$RUNNER_TEMP/changed-files"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check out the base registry
        if: steps.pr.outputs.number
        uses: actions/checkout@v4
        with:
          path: base

      - name: Check out the PR at the commit that passed
        if: steps.pr.outputs.number
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: head
          persist-credentials: false

      - name: Check the change is release-only and trusted
        id: eligible
        if: steps.pr.outputs.number
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python3 base/validation/auto_merge.py base head --branch "$HEAD_BRANCH" --changed-files "$RUNNER_TEMP/changed-files"

      # --match-head-commit makes GitHub refuse the merge if the PR moved on
      # after the check above.
      - name: Merge
        if: steps.eligible.outputs.mergeable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
